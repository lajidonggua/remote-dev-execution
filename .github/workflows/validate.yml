name: Validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate shell syntax
        run: sh -n scripts/dev-exec scripts/dev-relay scripts/install-skill.sh scripts/install-mutagen.sh scripts/setup-mutagen.sh tests/test-dev-exec.sh tests/test-dev-relay.sh tests/test-install-skill.sh tests/test-install-mutagen.sh tests/test-setup-mutagen.sh tests/test-relay-embedded.sh

      - name: Validate Skill metadata
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          validator_path = Path.home() / ".codex/skills/.system/skill-creator/scripts/quick_validate.py"
          if validator_path.exists():
              spec = importlib.util.spec_from_file_location("quick_validate", validator_path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              valid, message = module.validate_skill(Path.cwd())
              print(message)
              raise SystemExit(0 if valid else 1)

          import re
          import yaml
          text = Path("SKILL.md").read_text()
          match = re.match(r"^---\n(.*?)\n---", text, re.S)
          if not match:
              raise SystemExit("SKILL.md frontmatter is missing")
          frontmatter = yaml.safe_load(match.group(1))
          if set(frontmatter) != {"name", "description"}:
              raise SystemExit("SKILL.md frontmatter must contain only name and description")
          if frontmatter.get("name") != "remote-dev-execution":
              raise SystemExit("unexpected Skill name")
          if not frontmatter.get("description"):
              raise SystemExit("Skill description is empty")
          print("Skill metadata is valid")
          PY

      - name: Validate Codex UI metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          document = yaml.safe_load(Path("agents/openai.yaml").read_text())
          interface = document.get("interface", {})
          if interface.get("display_name") != "Remote Development Execution":
              raise SystemExit("unexpected display_name")
          short_description = interface.get("short_description", "")
          if not 25 <= len(short_description) <= 64:
              raise SystemExit("short_description must be 25-64 characters")
          if "$remote-dev-execution" not in interface.get("default_prompt", ""):
              raise SystemExit("default_prompt must mention the Skill")
          print("Codex UI metadata is valid")
          PY

      - name: Validate documentation and redaction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          docs = [
              Path("README.md"),
              Path("README.zh-CN.md"),
              Path("SKILL.md"),
              *sorted(Path("references").glob("*.md")),
          ]
          link_pattern = re.compile(r"\[[^\]]+\]\(([^)#]+)(?:#[^)]+)?\)")
          for document in docs:
              text = document.read_text()
              for link in link_pattern.findall(text):
                  if re.match(r"^(?:https?|mailto):", link):
                      continue
                  target = (document.parent / link).resolve()
                  if not target.exists():
                      raise SystemExit(f"broken link in {document}: {link}")

          forbidden = re.compile(
              "|".join(
                  [
                      "/" + r"(?:Users|home|var/folders)/",
                      "BEGIN " + ".*" + " PRIVATE KEY",
                      "AKIA" + r"[0-9A-Z]{16}",
                      "gh" + r"[pousr]_[A-Za-z0-9]+",
                      "Bearer " + r"[A-Za-z0-9._-]+",
                  ]
              )
          )
          tracked = subprocess.check_output(["git", "ls-files", "-z"])
          for raw_path in tracked.split(b"\0"):
              if not raw_path:
                  continue
              path = Path(raw_path.decode())
              if path in docs or path == Path(".github/workflows/validate.yml"):
                  continue
              if forbidden.search(path.read_text(errors="replace")):
                  raise SystemExit(f"possible sensitive value in {path}")
          print("Documentation links and redaction scan passed")
          PY

      - name: Run wrapper and installer tests
        run: tests/test-dev-exec.sh && tests/test-dev-relay.sh && tests/test-install-skill.sh && tests/test-install-mutagen.sh && tests/test-setup-mutagen.sh && tests/test-relay-embedded.sh
